[package]
name = "kompressor-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "OptScale Kompressor corpus replay harness: what the engine removes on real agent tool output, what it left alone, and whether any safety invariant broke."

[features]
default = ["code-aware"]
code-aware = ["kompressor-engine/code-aware"]

[dependencies]
kompressor-engine = { path = "../kompressor-engine", default-features = false }

serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
